[build]
  publish = "."

[build.processing]
  skip_processing = false

# Enable Netlify's native pretty URL handling.
# This causes Netlify to:
#   - Serve /about from about.html (200)
#   - 301 redirect /about.html -> /about
#   - 301 redirect /about/ -> /about
# Replacing the hand-rolled per-file redirects that previously were
# being intercepted by a broken "/*/" catch-all and never fired in
# production (producing duplicate /foo + /foo.html 200 responses).
[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# Custom headers for SEO, security, and crawlability
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Explicit noindex for the 404 page so Search Console never sees a
# conflicting signal between the global X-Robots-Tag: index and the
# page-level <meta name="robots" content="noindex">.
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Belt-and-suspenders canonicalization:
# Even with pretty_urls = true, explicitly 301 the .html variants to the
# extensionless canonical URL. Extension-specific rule only — no broad
# wildcards so non-existent paths fall through to the 404.html page
# instead of looping (the previous `/*/` rule caused 301 self-loops on
# every unknown URL, which Googlebot reports as "Redirect error").

[[redirects]]
  from = "/index.html"
  to = "https://telehealthnavigatorai.com/"
  status = 301
  force = true


