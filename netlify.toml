# Single-hop canonicalization for non-canonical hostnames so Googlebot
# never traverses a multi-hop chain that it could classify as a
# "Redirect error". The canonical host is the apex over HTTPS:
# https://telehealthnavigatorai.com
[[redirects]]
  from = "http://telehealthnavigatorai.com/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.telehealthnavigatorai.com/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["www.telehealthnavigatorai.com"]

[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["telehealthnavigatorai.netlify.app"]
