[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# Custom headers for SEO, security, and crawlability
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hostname canonicalization: www and netlify.app → apex domain
# These MUST be first so www/netlify.app requests redirect to the canonical
# domain before any path-specific rules match (prevents redirect chains)
[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["www.telehealthnavigatorai.com"]

[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["telehealthnavigatorai.netlify.app"]

# Explicit .html → clean URL redirects (force = true ensures these
# take precedence over pretty_urls build processing)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/chat.html"
  to = "/chat"
  status = 301
  force = true

