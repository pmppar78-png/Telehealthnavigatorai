[build]
  publish = "."
  command = "sh scripts/decode-images.sh"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# X-Robots-Tag: noindex only on /404.html, /404, /chat and /chat.html.
# Netlify applies every [[headers]] block whose `for` matches, so no other rule
# sets X-Robots-Tag; with no header, pages are indexable by default. A `for`
# path also matches with a trailing slash, so "/chat" covers /chat/.
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/chat"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/chat.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Sitewide security headers (no X-Robots-Tag here; see above)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# REDIRECT RULES — ordered to eliminate ALL redirect chains
# ============================================================
# Rule processing: Netlify evaluates top-to-bottom, first match wins.
# Strategy: specific .html rules → catch-all .html → renamed guides →
# host canonicalization. ALL targets use absolute canonical URLs so
# requests from ANY host (www, netlify.app) resolve in a single 301.
# ============================================================

# 1. /index.html is a special case: catch-all /*.html would map it
#    to /index (wrong), so this explicit rule sends it to / instead.
# Alias: the editorial policy lives at /editorial-standards.
[[redirects]]
  from = "/editorial-policy"
  to = "https://telehealthnavigatorai.com/editorial-standards"
  status = 301
  force = true

# Browsers and crawlers request /favicon.ico by default; serve the logo.
[[redirects]]
  from = "/favicon.ico"
  to = "/logo.svg"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://telehealthnavigatorai.com/"
  status = 301
  force = true

# 2. Renamed/merged guide .html variants — must fire before the
#    catch-all /*.html rule, which would redirect them to a path
#    that no longer exists.
[[redirects]]
  from = "/guide-feeling-overwhelmed.html"
  to = "https://telehealthnavigatorai.com/guide-stress-management-telehealth"
  status = 301
  force = true

[[redirects]]
  from = "/guide-free-low-cost-therapy.html"
  to = "https://telehealthnavigatorai.com/guide-find-low-cost-telehealth"
  status = 301
  force = true

[[redirects]]
  from = "/guide-mood-disorders.html"
  to = "https://telehealthnavigatorai.com/guide-depression-treatment-online"
  status = 301
  force = true

[[redirects]]
  from = "/guide-persistent-sadness.html"
  to = "https://telehealthnavigatorai.com/guide-depression-treatment-online"
  status = 301
  force = true

[[redirects]]
  from = "/guide-phobias-online-therapy.html"
  to = "https://telehealthnavigatorai.com/guide-anxiety-online-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/guide-social-anxiety-online.html"
  to = "https://telehealthnavigatorai.com/guide-anxiety-online-therapy"
  status = 301
  force = true

# 3. Catch-all .html → clean URL redirect. Handles ALL remaining
#    .html requests from ANY host in a single 301 — no chains.
#    Example: www.telehealthnavigatorai.com/about.html →
#             telehealthnavigatorai.com/about (one redirect)
[[redirects]]
  from = "/*.html"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true

# 4. Renamed/merged guide clean-URL variants — must fire before
#    the host catch-all so www/netlify.app requests for old guide
#    names resolve in a single redirect.
[[redirects]]
  from = "/guide-feeling-overwhelmed"
  to = "https://telehealthnavigatorai.com/guide-stress-management-telehealth"
  status = 301
  force = true

[[redirects]]
  from = "/guide-free-low-cost-therapy"
  to = "https://telehealthnavigatorai.com/guide-find-low-cost-telehealth"
  status = 301
  force = true

[[redirects]]
  from = "/guide-mood-disorders"
  to = "https://telehealthnavigatorai.com/guide-depression-treatment-online"
  status = 301
  force = true

[[redirects]]
  from = "/guide-persistent-sadness"
  to = "https://telehealthnavigatorai.com/guide-depression-treatment-online"
  status = 301
  force = true

[[redirects]]
  from = "/guide-phobias-online-therapy"
  to = "https://telehealthnavigatorai.com/guide-anxiety-online-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/guide-social-anxiety-online"
  to = "https://telehealthnavigatorai.com/guide-anxiety-online-therapy"
  status = 301
  force = true

# 5. Host canonicalization: www and netlify.app → apex domain.
#    Placed AFTER .html and renamed-guide rules so those specific
#    patterns are already handled — only non-.html, non-renamed
#    requests reach these catch-all host rules.
[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["www.telehealthnavigatorai.com"]

[[redirects]]
  from = "/*"
  to = "https://telehealthnavigatorai.com/:splat"
  status = 301
  force = true
  [redirects.conditions]
    Host = ["telehealthnavigatorai.netlify.app"]

# Source and data files are not public pages
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
