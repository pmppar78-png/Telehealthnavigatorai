<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="wpTitle wpDesc">
<title id="wpTitle">Published weekly self-pay prices for five online therapy services</title>
<desc id="wpDesc">Bar ranges, in US dollars per week, taken from the price table in our online therapy platforms guide (checked October 22 and 24, 2026): Calmerry $57 to $90, Online-Therapy.com $60 to $120, Talkspace $69 to $109, BetterHelp $70 to $100, ReGain $70 to $100. Original chart, not a screenshot of any company site.</desc>
<rect width="720" height="330" rx="12" fill="#f4f7f5"/>
<text x="24" y="34" font-family="Georgia, serif" font-size="18" fill="#163028">Regular weekly self-pay price, by plan (US$)</text>
<g font-family="system-ui, sans-serif" font-size="13" fill="#3d5348">
<line x1="200" y1="56" x2="200" y2="262" stroke="#d5e0da"/><text x="200" y="280" text-anchor="middle">$40</text>
<line x1="253" y1="56" x2="253" y2="262" stroke="#d5e0da"/><text x="253" y="280" text-anchor="middle">$50</text>
<line x1="307" y1="56" x2="307" y2="262" stroke="#d5e0da"/><text x="307" y="280" text-anchor="middle">$60</text>
<line x1="360" y1="56" x2="360" y2="262" stroke="#d5e0da"/><text x="360" y="280" text-anchor="middle">$70</text>
<line x1="413" y1="56" x2="413" y2="262" stroke="#d5e0da"/><text x="413" y="280" text-anchor="middle">$80</text>
<line x1="467" y1="56" x2="467" y2="262" stroke="#d5e0da"/><text x="467" y="280" text-anchor="middle">$90</text>
<line x1="520" y1="56" x2="520" y2="262" stroke="#d5e0da"/><text x="520" y="280" text-anchor="middle">$100</text>
<line x1="573" y1="56" x2="573" y2="262" stroke="#d5e0da"/><text x="573" y="280" text-anchor="middle">$110</text>
<line x1="627" y1="56" x2="627" y2="262" stroke="#d5e0da"/><text x="627" y="280" text-anchor="middle">$120</text>
<line x1="680" y1="56" x2="680" y2="262" stroke="#d5e0da"/><text x="680" y="280" text-anchor="middle">$130</text>
</g>
<g font-family="system-ui, sans-serif" font-size="14" fill="#163028">
<text x="188" y="81" text-anchor="end">Calmerry</text><rect x="291" y="67" width="176" height="18" rx="9" fill="#1f7a4d"/><text x="475" y="81" font-size="13">$57 to $90</text>
<text x="188" y="121" text-anchor="end">Online-Therapy.com</text><rect x="307" y="107" width="320" height="18" rx="9" fill="#1f7a4d"/><text x="635" y="121" font-size="13">$60 to $120</text>
<text x="188" y="161" text-anchor="end">Talkspace</text><rect x="355" y="147" width="213" height="18" rx="9" fill="#1f7a4d"/><text x="576" y="161" font-size="13">$69 to $109</text>
<text x="188" y="201" text-anchor="end">BetterHelp</text><rect x="360" y="187" width="160" height="18" rx="9" fill="#1f7a4d"/><text x="528" y="201" font-size="13">$70 to $100</text>
<text x="188" y="241" text-anchor="end">ReGain (couples)</text><rect x="360" y="227" width="160" height="18" rx="9" fill="#1f7a4d"/><text x="528" y="241" font-size="13">$70 to $100</text>
</g>
<text x="24" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#3d5348">Source: each company's pricing or FAQ page. First-month discounts not shown; confirm at sign-up.</text></svg>
